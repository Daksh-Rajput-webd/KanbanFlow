<header class="app-header">
  <div class="app-header__brand">
    <svg class="app-header__logo" viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2" y="3" width="20" height="18" rx="4" fill="var(--accent-soft)"/>
      <rect x="5" y="6" width="4" height="7" rx="1.2" fill="var(--accent)"/>
      <rect x="10" y="6" width="4" height="11" rx="1.2" fill="var(--accent)"/>
      <rect x="15" y="6" width="4" height="4" rx="1.2" fill="var(--accent)"/>
    </svg>
    <h1>KanbanFlow</h1>
  </div>

  <div class="app-header__search">
    <input
      type="text"
      placeholder="Search tasks or labels..."
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchInput($event)"
    />
  </div>

  <div class="app-header__actions">
    <button type="button" class="btn btn--primary" (click)="addColumn.emit()">+ Column</button>
    <button type="button" class="btn btn--icon" (click)="openSettings.emit()" title="Settings" aria-label="Open settings">
      ⚙️
    </button>
  </div>
</header>
